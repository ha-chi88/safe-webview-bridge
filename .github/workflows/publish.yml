name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing stable version in package.json (for example, 2.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ha-chi88/safe-webview-bridge' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish reviewed package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Download the package built in this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package

      - name: Validate package identity and requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Enter a stable version such as 2.0.0.' >&2
            exit 1
          fi
          package="$RUNNER_TEMP/npm-package/safe-webview-bridge-$EXPECTED_VERSION.tgz"
          tar -xOf "$package" package/package.json | node --input-type=module -e '
            import assert from "node:assert/strict";
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const manifest = JSON.parse(raw);
            assert.equal(manifest.name, "safe-webview-bridge");
            assert.equal(manifest.version, process.env.EXPECTED_VERSION);
            assert.equal(manifest.repository?.url, "git+https://github.com/ha-chi88/safe-webview-bridge.git");
          '

      - name: Publish with OIDC and provenance
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: npm publish "$RUNNER_TEMP/npm-package/safe-webview-bridge-$EXPECTED_VERSION.tgz" --access public --provenance --ignore-scripts
