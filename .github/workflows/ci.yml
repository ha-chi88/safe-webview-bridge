name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependabot-metadata:
    name: Dependabot metadata
    if: github.event_name == 'pull_request' && github.event.pull_request.user.id == 49699333 && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.id == github.repository_id
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
      - name: Check stable package updates
        id: policy
        env:
          METADATA: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          eligible=false
          if jq -e '
            def stable: type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$");
            type == "array" and length > 0 and all(.[];
              .packageEcosystem == "npm_and_yarn" and .targetBranch == "main" and
              .maintainerChanges == false and
              (.prevVersion | stable) and (.newVersion | stable) and
              (.prevVersion | split(".") | map(tonumber)) as $old |
              (.newVersion | split(".") | map(tonumber)) as $new |
              $new > $old
            )
          ' <<< "$METADATA" >/dev/null; then eligible=true; fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "Dependabot automatic merge eligibility: $eligible. Stable forward updates include majors; unstable, unknown and maintainer-edited updates require review." >> "$GITHUB_STEP_SUMMARY"

  dependabot-eligible:
    name: Dependabot eligible
    needs: dependabot-metadata
    if: needs.dependabot-metadata.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "Verified metadata permits this stable dependency update."

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check source, runtime behavior, and the distributable package
        run: pnpm check

      - name: Install Chromium for browser integration tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser message delivery and origin isolation
        run: pnpm test:browser

      - name: Audit production and development dependencies
        run: pnpm audit

      - name: Pack without running lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"

      - name: Save the package from this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.sha }}
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7
